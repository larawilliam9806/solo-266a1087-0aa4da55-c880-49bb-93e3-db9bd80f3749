services:
  api:
    build: .
    container_name: recon-api
    ports:
      - "8000:8000"
    environment:
      # SQLite 数据库文件放在挂载卷中，容器重启后确认结果保留
      RECON_DB_PATH: /data/recon.db
    volumes:
      - recon-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  recon-data:
